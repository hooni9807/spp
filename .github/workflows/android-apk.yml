name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - run: npm ci
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: spp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          cp "$APK" SPP.apk
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-latest SPP.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-latest SPP.apk --title "SPP 최신 Android APK" --notes "main 최신 빌드입니다." --repo "$GITHUB_REPOSITORY"
          fi
