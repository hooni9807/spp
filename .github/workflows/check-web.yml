name: Web syntax check

# 웹판(GitHub Pages)은 main 푸시 즉시 배포되므로, 문법 오류가 들어오면 바로 알 수 있게 검사한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-syntax.cjs

  # 브라우저 테스트(tests/*.cjs): 실패하면 어떤 테스트가 깨졌는지 이름을 모아 보여 준다.
  tests:
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run tests
        run: |
          fail=0
          for t in tests/*.cjs; do
            node "$t" > /tmp/out.txt 2>&1 || { fail=$((fail+1)); echo "::error file=$t::$(tail -c 400 /tmp/out.txt | tr '\n' ' ')"; }
          done
          echo "failed: $fail"
          [ "$fail" -eq 0 ]
